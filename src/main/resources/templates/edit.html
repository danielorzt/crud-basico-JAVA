<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Editar Producto</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
	<div class="container">
		<h1>Editar Producto</h1>

		<form th:action="@{/productos/save}" method="post">
			<!-- Campo oculto para enviar el ID del producto -->
			<input type="hidden" name="id" th:value="${producto.id}" />

			<div class="mb-3">
				<label for="nombre" class="form-label">Nombre del Producto</label>
				<input type="text" class="form-control" id="nombre" name="nombre" 
					th:value="${producto.nombre}" placeholder="Escriba el nombre del producto">
			</div>
			<div class="mb-3">
				<label for="descripcion" class="form-label">Descripción del Producto</label>
				<input type="text" class="form-control" id="descripcion" name="descripcion" 
					th:value="${producto.descripcion}" placeholder="Escriba la descripción del producto">
			</div>
			<div class="mb-3">
				<label for="precio" class="form-label">Precio del Producto</label>
				<input type="text" class="form-control" id="precio" name="precio" 
					th:value="${producto.precio}" placeholder="Escriba el precio del producto">
			</div>
			<button type="submit" class="btn btn-success">Guardar</button>
			<a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
		</form>
	</div>
</body>

</html>
